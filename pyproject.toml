[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "docling-math"
version = "0.1.0"
description = "GPU-first, high-fidelity academic PDF extraction with careful math and tables."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "heri-espino" }
]
dependencies = [
  "docling[rapidocr]==2.129.0",
  "pillow>=10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[project.scripts]
docling-math = "docling_math.extractor:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docling_math"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
