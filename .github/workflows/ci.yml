name: CI

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: python -m compileall -q src

      - name: Test metadata, naming, and literature tools
        run: |
          python -m pip install pytest pyyaml "pypdf>=6.7,<7"
          PYTHONPATH=src python -m pytest -q \
            tests/test_metadata.py \
            tests/test_pdf_metadata.py \
            tests/test_naming.py \
            tests/test_rename_literature.py \
            tests/test_corpus_upgrade.py

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
